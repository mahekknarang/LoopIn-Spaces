{% extends "base.html" %}
{% block title %}Admin · LoopIn Spaces{% endblock %}
{% block content %}<main id="admin-page"><section id="admin-login" class="pin-page"><div class="section-kicker">SPACE ADMIN</div><h1>Admin access.</h1><p>Sign in to manage rooms, timetable, and booking requests.</p><form id="admin-login-form" class="admin-login-form"><label for="admin-username">USERNAME</label><input class="pin-input" id="admin-username" name="username" autocomplete="username" required><label for="admin-password">PASSWORD</label><input class="pin-input" id="admin-password" name="password" type="password" autocomplete="current-password" required><div id="pin-error" class="form-error" role="alert"></div><button class="button primary" id="pin-submit">Sign in</button></form></section><section id="admin-app" class="hidden"></section></main>{% endblock %}{% block scripts %}<script src="{{ url_for('static', filename='js/app.js', v=4) }}"></script>{% endblock %}
